name: CI

on:
  push:
    branches: [main, development_branch]
  pull_request:
    branches: [main, development_branch]

jobs:
  quality:
    name: Lint, tests, E2E and builds
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: collabwave
          POSTGRES_USER: collabwave_user
          POSTGRES_PASSWORD: collabwave_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collabwave_user -d collabwave"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://collabwave_user:collabwave_pass@localhost:5432/collabwave
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret-which-is-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-which-is-different-and-long
      CORS_ORIGINS: http://localhost:5173
      RATE_LIMIT_MAX_REQUESTS: 1000
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Migration smoke test on empty database
        run: npm run migrate --prefix backend
      - name: Migration smoke test on migrated database
        run: npm run migrate --prefix backend
      - name: Lint
        run: npm run lint
      - name: Backend tests
        run: npm run test:ci --prefix backend
      - name: Frontend tests
        run: npm run test --prefix frontend
      - name: Production builds
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: End-to-end tests
        run: npm run test:e2e
        working-directory: frontend
      - name: Production dependency audit
        run: |
          npm audit --omit=dev --prefix backend
          npm audit --omit=dev --prefix frontend
